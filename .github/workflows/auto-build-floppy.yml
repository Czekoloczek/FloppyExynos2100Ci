# .github/workflows/auto-build-floppy.yml
#
# Watches the upstream Floppy Exynos 2100 kernel repo and auto-builds the
# ReSukiSU (SukiSU + KPM + SUSFS) variant with our patches from patches/ on top.
# A build runs when the upstream commit OR the patch set changes, and each one is
# published as a GitHub Release, so the same combination is never built twice.
#
# Tag format: auto-<YYYYMMDD-HHMMSS>-<upstream short SHA>-p<patches/ tree SHA>
#
# The timestamp is not decoration. GitHub sorts the Releases page by the date of
# the commit a tag points at — and every tag here points at the same commit on
# this repo's default branch, so they all tie. The tie is broken on tag name,
# descending, which with a bare SHA prefix is effectively random order. A
# zero-padded UTC timestamp in front makes that tiebreak chronological.
# Releases from before patches/ existed use "auto-<stamp>-<short>" or "auto-<short>".
#
# patches/*.patch are applied in name order with `git am`. A patch that upstream
# already contains is skipped; any other failure stops the build, because a
# release without our fixes would silently bring the bugs back.
#
# Put this file at:  .github/workflows/auto-build-floppy.yml
# Then: repo Settings -> Actions -> General -> allow workflows (forks: enable in Actions tab).

name: Auto-build Floppy (ReSukiSU)

on:
  schedule:
    # Every 6 hours (UTC). Adjust as you like. NOTE: GitHub may delay scheduled
    # runs under load, and DISABLES schedules after 60 days of repo inactivity.
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Build even if this commit and patch set were already built'
        type: boolean
        default: false

permissions:
  contents: write        # needed to create Releases with GITHUB_TOKEN

concurrency:
  group: floppy-auto-build
  cancel-in-progress: false

env:
  UPSTREAM_OWNER: FlopKernel-Series
  UPSTREAM_REPO: flop_exynos2100_kernel
  BRANCH: floppy-main
  VARIANT: s                 # s = ReSukiSU (SukiSU+KPM+SUSFS). Use 'k' KSU-Next, 'u' RKSU, '' Vanilla
  ENABLE_KPM_PATCH: 'false'  # set 'true' ONLY if SukiSU manager shows KPM inactive (uncomments apply_kpm_patch)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo (patches/)
        uses: actions/checkout@v4
        with:
          path: ci

      - name: Resolve latest upstream commit and patch set
        id: up
        run: |
          SHA=$(git ls-remote "https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}.git" "refs/heads/${BRANCH}" | cut -f1)
          [ -n "$SHA" ] || { echo "Could not resolve upstream SHA"; exit 1; }
          # Tree SHA of patches/: changes whenever a patch is added, edited or removed.
          PID=$(git -C ci rev-parse --short=7 HEAD:patches 2>/dev/null || echo none)
          echo "sha=$SHA"            >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:8}"    >> "$GITHUB_OUTPUT"
          echo "pid=$PID"            >> "$GITHUB_OUTPUT"
          echo "Upstream ${BRANCH} is at $SHA, patch set p$PID"

      - name: Decide whether to build
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.force }}
          SHORT: ${{ steps.up.outputs.short }}
          PID: ${{ steps.up.outputs.pid }}
        run: |
          # Tags are read into a variable first: with `gh api … | grep -q` an early
          # grep exit can SIGPIPE gh, and under pipefail a match would read as a miss.
          TAGS=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq '.[].tag_name')
          if [ "$FORCE" != "true" ] && grep -qE "^auto-[0-9]{8}-[0-9]{6}-${SHORT}-p${PID}$" <<<"$TAGS"; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Commit ${SHORT} with patch set p${PID} already has a release — nothing to do."
          else
            echo "build=true"  >> "$GITHUB_OUTPUT"
          fi

      - name: Free up disk space
        if: steps.gate.outputs.build == 'true'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - name: Clone upstream (recursive — needs build/mkbootimg submodule)
        if: steps.gate.outputs.build == 'true'
        run: |
          git clone --depth 1 --recurse-submodules \
            --branch "${BRANCH}" \
            "https://github.com/${UPSTREAM_OWNER}/${UPSTREAM_REPO}.git" kernel

      - name: Apply our patches (patches/*.patch)
        if: steps.gate.outputs.build == 'true'
        working-directory: kernel
        run: |
          shopt -s nullglob
          : > ../applied-patches.txt
          for p in ../ci/patches/*.patch; do
            n=$(basename "$p")
            if git apply --check --reverse "$p" 2>/dev/null; then
              echo "Already in upstream, skipping: $n"
              continue
            fi
            if ! git -c user.name=ci -c user.email=ci@localhost am -q --3way "$p"; then
              git am --abort || true
              echo "::error::$n no longer applies to ${BRANCH}; refresh it"
              exit 1
            fi
            echo "Applied: $n"
            echo "$n" >> ../applied-patches.txt
          done
          # LineageOS 23.2 needs SAE offload advertised by bcmdhd_101_18, or every WPA3 network fails.
          grep -q NL80211_EXT_FEATURE_SAE_OFFLOAD drivers/net/wireless/broadcom/bcmdhd_101_18/wl_cfg80211.c \
            || { echo "::error::SAE offload missing in bcmdhd_101_18 after patches"; exit 1; }
          # p3s must not have the 96 Hz based display modes (96HS, and 48HS = 96HS + TE skip): they
          # switch the panel to 96 Hz and make it flicker in tone. The panel driver parses every mode
          # node and never reads exposed-mode, so the nodes themselves must be gone.
          dts=(arch/arm64/boot/dts/exynos/samsung/p3s/p3s_eur_openx_w01_r*.dts)
          [ ${#dts[@]} -gt 0 ] || { echo "::error::no p3s DTS found"; exit 1; }
          if grep -lE 'o3s_panel_display_mode_[0-9x]+_(96|48)hs' "${dts[@]}"; then
            echo "::error::96/48 Hz display mode nodes are still in the p3s DTS files listed above"
            exit 1
          fi

      - name: Cache toolchain + ccache
        if: steps.gate.outputs.build == 'true'
        uses: actions/cache@v4
        with:
          path: |
            toolchains
            ~/.cache/ccache
          key: floppy-tc-ccache-${{ steps.up.outputs.short }}-p${{ steps.up.outputs.pid }}
          restore-keys: |
            floppy-tc-ccache-

      - name: (Optional) Enable KPM Image patch
        if: steps.gate.outputs.build == 'true' && env.ENABLE_KPM_PATCH == 'true'
        working-directory: kernel
        run: sed -i 's/^\s*#\s*apply_kpm_patch/apply_kpm_patch/' build/ckbuild.sh

      - name: Build kernel
        if: steps.gate.outputs.build == 'true'
        working-directory: kernel
        env:
          WP: ${{ github.workspace }}   # toolchains land in $WP/toolchains (parent of kernel/)
          USE_CCACHE: '1'
        run: |
          # deps.sh auto-installs apt packages (flex, bc, cpio, kmod, zip, lz4, brotli,
          # ccache, aarch64 binutils) via sudo on the runner.
          bash do_build.sh ${VARIANT}
          echo "---- artifacts ----"; ls -lh build/*.zip build/*.tar || true

      - name: Publish Release
        if: steps.gate.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT: ${{ steps.up.outputs.short }}
          PID: ${{ steps.up.outputs.pid }}
        run: |
          TAG="auto-$(date -u +%Y%m%d-%H%M%S)-${SHORT}-p${PID}"

          # On a forced rebuild there may already be a release for this commit and
          # patch set; drop it so we don't leave duplicates.
          TAGS=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --paginate --jq '.[].tag_name')
          mapfile -t STALE < <(grep -E "^auto-[0-9]{8}-[0-9]{6}-${SHORT}-p${PID}$" <<<"$TAGS" || true)
          for old in "${STALE[@]}"; do
            [ -n "$old" ] || continue
            echo "Removing stale release $old"
            gh release delete "$old" -R "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
          done

          PATCHES=$(sed 's/^/- /' applied-patches.txt)
          gh release create "$TAG" \
            -R "$GITHUB_REPOSITORY" \
            -t "Floppy ReSukiSU @ ${SHORT} + patches p${PID}" \
            -n "Automated build of ${UPSTREAM_OWNER}/${UPSTREAM_REPO}@${{ steps.up.outputs.sha }}
          Variant: ${VARIANT} (ReSukiSU / SukiSU + KPM + SUSFS)
          Patches applied (patches/ @ p${PID}):
          ${PATCHES:-- none}
          Flash the .zip in OrangeFox, or the FloppyOneUI .tar via Odin (One UI base)." \
            kernel/build/*.zip kernel/build/*.tar
